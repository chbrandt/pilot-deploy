# values.yaml — Default configuration for the HPC Pilot deployment chart.
#
# The chart runs the TWO services produced by the pilot-* repository split:
#
#   pilot-api — the REST API server (pilot-api repository). Talks to
#               Kubernetes, Helm and the HPC edge-nodes; needs the RBAC
#               resources, the pilot_config.yaml ConfigMap and (optionally)
#               the data PVC.
#   pilot-app — the web GUI (pilot-app repository). A pure HTTP client of
#               the API (API_BASE_URL); rendered to users by the Ingress.
#
# Override any of these values in a custom values file:
#   helm install pilot ./charts/manager -f my-values.yaml

# ── Namespace ────────────────────────────────────────────────────────────
namespace: hpc-pilot

# ── Pilot API service (pilot-api) ─────────────────────────────────────────
api:
  image:
    repository: ghcr.io/chbrandt/pilot-api
    tag: latest
    pullPolicy: Always
    # pullSecrets:
    #   - name: my-registry-secret

  replicaCount: 1

  flask:
    port: 5000
    debug: "0"
    # secretKey: supply a strong random value here or reference an existing
    # Secret below. If left empty a placeholder value is used
    # (NOT safe for production).
    secretKey: "ok-for-dev-only-change-me--in-prod-use-a-secret-or-random-value"
    # Reference an existing Secret instead of creating one from secretKey.
    existingSecret: ""
    existingSecretKey: flask-secret-key

  # Persistent storage for per-user saved deployment configs (API-owned).
  persistence:
    enabled: false
    # storageClass: ""   # leave blank to use the cluster default
    accessMode: ReadWriteOnce
    size: 1Gi
    # existingClaim: ""  # use a pre-existing PVC instead of creating one

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Pilot App / web GUI service (pilot-app) ───────────────────────────────
app:
  image:
    repository: ghcr.io/chbrandt/pilot-app
    tag: latest
    pullPolicy: Always
    # pullSecrets:
    #   - name: my-registry-secret

  replicaCount: 1

  flask:
    port: 5000
    debug: "0"
    secretKey: "ok-for-dev-only-change-me--in-prod-use-a-secret-or-random-value"
    existingSecret: ""
    existingSecretKey: app-flask-secret-key

  # Base URL of the Pilot API as seen from the GUI pod. When empty
  # (default) the chart derives it from the in-cluster API Service
  # (http://<fullname>-api:80). Override to point at an API outside
  # this cluster.
  apiBaseUrl: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ── Site configuration (written into the pilot_config.yaml ConfigMap) ──────
siteConfig:
  # Single fixed hostname the manager and every user's InterLink wstunnel
  # endpoint are exposed on. No wildcard DNS / wildcard TLS needed: each
  # user's tunnel is reached at <hostname>/<namespace> via path-prefix
  # routing.
  hostname: pilot.example.org

  # Default container image proposed in the Submit Job form.
  defaultImage: ubuntu:22.04

  wstunnel:
    # Port the wstunnel Ingress listens on (the port the HPC-side wstunnel
    # client connects to).
    port: 443
    # Local TCP port on the HPC edge-node that wstunnel forwards to the
    # InterLink plugin.
    localPort: 4000

  # Optional list of EGI VO entitlement substrings that restrict login.
  # When non-empty, only users whose UserInfo contains at least one of
  # these substrings are granted access. Leave empty for open access.
  allowedGroups: []
    # - "vo.access.egi.eu"
    # - "hpc-wg"

  # ── EGI Check-in OAuth login (optional) ────────────────────────────────
  # Rendered into the `site.oidc` block of pilot_config.yaml, mounted into
  # the pilot-api pod. pilot-api owns the whole authentication backend: it
  # performs the OAuth code→token exchange (POST /api/auth/oidc/exchange),
  # validates every access token (POST /api/auth/verify and `require_token`
  # on protected routes) and publishes client_id/issuer/audience to remote
  # clients through the public GET /api/site endpoint. The GUI (pilot-app)
  # is a pure HTTP client — it never receives the client secret nor a
  # config file.
  oidc:
    # OIDC client registered in EGI Check-in. When non-empty the login page
    # shows the "Log in with EGI Check-in" button; leave empty to disable
    # it (the token-paste login still works).
    clientId: ""
    # Keycloak realm used to build the authorize/token endpoints.
    issuer: "https://aai.egi.eu/auth/realms/egi"
    # Optional explicit OAuth callback; empty =
    # <siteConfig.hostname>/oauth/callback (derived by the GUI).
    redirectUri: ""
    # Optional expected JWT 'aud' claim, enforced by pilot-api when
    # validating tokens (empty = the claim is not checked). Also published
    # through GET /api/site for standalone clients minting their own tokens.
    audience: ""
    # Secret for confidential OIDC clients. NOT written into
    # pilot_config.yaml — it is injected into the pilot-api pod as
    # PILOT_OIDC_CLIENT_SECRET (the GUI never receives it).
    clientSecret: ""
    # Reference a pre-existing Secret (holding the client secret at
    # existingSecretKey) instead of clientSecret above.
    existingSecret: ""
    existingSecretKey: pilot-oidc-client-secret

interlinkConfig:
  chart: oci://ghcr.io/chbrandt/interlink-helm-chart/interlink
  version: 0.6.1-egi.5

  # You probably don't need to change the values below.
  #
  # Note: the wstunnel ingress host, external port, internal port and secret
  # are NOT configurable here — they are derived from `siteConfig`
  # (hostname, wstunnel.port, wstunnel.localPort) and from the per-user
  # namespace (`__NAMESPACE__`), so every user's tunnel stays consistent
  # with the site-level routing configuration.
  wstunnel:
    logLevel: debug
    # Port on which the wstunnel server in the InterLink pod listens.
    port: 8080

  virtualNode:
    # Do not request a cluster-signed kubelet serving certificate via a CSR.
    disableCSR: true

  interlink:
    # Port on which the InterLink API server in the InterLink pod listens.
    port: 3000
    address: http://0.0.0.0
    disableProjectedVolumes: true

  plugin:
    # Port on which the plugin API server in the HPC edge-node listens.
    port: 4000
    address: http://0.0.0.0

# ── HPC node connection details (written into pilot_config.yaml ConfigMap) ─
hpcConfig:
  nodes: {}
    # test-echo:
    #   hostname: 161.9.255.206
    #   ssh_port: 22
    #   plugin: echo

# ── Ingress ────────────────────────────────────────────────────────────────
# "/"              → pilot-app Service (the browser GUI)
# "/api" (Prefix)  → pilot-api Service (REST API + Swagger UI at /api/docs)
ingress:
  enabled: true
  className: nginx
  pathType: Prefix
  port: 80
  annotations:
    # Allow long-running helm install --wait requests (up to 6 minutes)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "360"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "360"
  tls:
    # TLS for siteConfig.hostname. The chart derives the host list from
    # siteConfig.hostname — only the secret name is configurable here.
    enabled: true
    secretName: pilot-tls
    # - A certificate for siteConfig.hostname must exist in the secret.
