{{- if and .Values.api.persistence.enabled (not .Values.api.persistence.existingClaim) }}
{{/*
PersistentVolumeClaim for the pilot-api data/ directory.

The API stores per-user saved deployment configs as JSON files under
/app/data/<namespace>.json.  Without a PVC these files are lost on pod
restart.  For a single-replica deployment ReadWriteOnce is sufficient.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "manager.pvcName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.api.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size | quote }}
  {{- if .Values.api.persistence.storageClass }}
  storageClassName: {{ .Values.api.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
