{{/*
Secret: session keys (+ optional OIDC client secret).

Keys (only rendered when the operator has not supplied an existing Secret
for that purpose):
  flask-secret-key           — FLASK_SECRET_KEY for pilot-api
  app-flask-secret-key       — FLASK_SECRET_KEY for pilot-app
  pilot-oidc-client-secret   — PILOT_OIDC_CLIENT_SECRET for pilot-api
                               (optional; empty disables confidential-client auth)
*/}}
{{- $chartApiSecret := not .Values.api.flask.existingSecret }}
{{- $chartAppSecret := not .Values.app.flask.existingSecret }}
{{- $chartOidcSecret := not .Values.siteConfig.oidc.existingSecret }}
{{- if or $chartApiSecret $chartAppSecret $chartOidcSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "manager.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $chartApiSecret }}
  flask-secret-key: {{ .Values.api.flask.secretKey | default "dev-secret-change-in-production" | quote }}
  {{- end }}
  {{- if $chartAppSecret }}
  app-flask-secret-key: {{ .Values.app.flask.secretKey | default "dev-secret-change-in-production" | quote }}
  {{- end }}
  {{- if $chartOidcSecret }}
  pilot-oidc-client-secret: {{ .Values.siteConfig.oidc.clientSecret | default "" | quote }}
  {{- end }}
{{- end }}
