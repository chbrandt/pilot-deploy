# Local full-stack recipe for HPC Pilot (pilot-deploy).
#
# Runs the two prebuilt service images: pilot-api (REST API server) and
# pilot-app (web GUI). The GUI talks to the API via API_BASE_URL over the
# compose network.
#
#   GUI  → http://localhost:5001
#   API  → http://localhost:5000  (Swagger UI at /api/docs)
#   /api/site -> public site metadata (requires pilot_config.yaml —
#               mount one below or point PILOT_CONFIG_PATH at it)
#
# Prerequisites:
#   - images built from the pilot-api and pilot-app repositories:
#       docker build -t ghcr.io/chbrandt/pilot-api:latest .   # in pilot-api
#       docker build -t ghcr.io/chbrandt/pilot-app:latest .   # in pilot-app
#   - a kubeconfig the API can use (mounted below), unless the manager is
#     running against an actual cluster.

name: hpc-pilot

services:
  pilot-api:
    image: ghcr.io/chbrandt/pilot-api:latest
    environment:
      FLASK_PORT: "5000"
      FLASK_DEBUG: "0"
      # Provide a strong random value in production:
      #   python -c 'import secrets; print(secrets.token_hex(32))'
      FLASK_SECRET_KEY: dev-secret-change-in-production
      # Confidential EGI Check-in clients (optional):
      # PILOT_OIDC_CLIENT_SECRET: ""
    volumes:
      # The API's kubeconfig — adjust the path on the left to your system.
      - ~/.kube/config:/root/.kube/config:ro
      # Custom unified configuration (optional; overrides the baked-in
      # server/pilot_config.yaml):
      # - ./pilot_config.yaml:/app/pilot_config.yaml:ro
    ports:
      - "5000:5000"

  pilot-app:
    image: ghcr.io/chbrandt/pilot-app:latest
    environment:
      FLASK_PORT: "5000"
      FLASK_SECRET_KEY: dev-secret-change-in-production
      # The compose service name resolves inside the network:
      API_BASE_URL: http://pilot-api:5000
    ports:
      - "5001:5000"
    depends_on:
      - pilot-api
